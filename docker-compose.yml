# ============================================================
# AusEdu Connect — Production Docker Compose for Coolify / Hostinger VPS
# ============================================================

services:
  # ----------------------------------------------------------
  # 1. PostgreSQL 16 (Relational Database)
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aus-edu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aus_edu_connect
      POSTGRES_USER: aus_edu
      POSTGRES_PASSWORD: aus_edu_secure_password_2026
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aus_edu -d aus_edu_connect"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aus-edu-network

  # ----------------------------------------------------------
  # 2. Redis 7 (Cache & Rate Limiting)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aus-edu-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aus-edu-network

  # ----------------------------------------------------------
  # 3. Backend API (NestJS + Prisma)
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: aus-edu-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://aus_edu:aus_edu_secure_password_2026@postgres:5432/aus_edu_connect?schema=public
      JWT_SECRET: 9fa8e7d6c5b4a3210fedcba9876543210abcdef0123456789abcdef01234567
      JWT_REFRESH_SECRET: 1234567890abcdef0123456789abcdef9fa8e7d6c5b4a3210fedcba9876543210
      JWT_EXPIRY_MINUTES: 60
      JWT_REFRESH_EXPIRY_DAYS: 30
      CORS_ORIGINS: "*"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /app/storage
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      WORKER_ENABLED: "true"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks:
      - aus-edu-network

  # ----------------------------------------------------------
  # 4. Frontend Web (React 18 + Vite + Nginx)
  # ----------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: aus-edu-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VITE_API_URL: /api
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - aus-edu-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  aus-edu-network:
    driver: bridge

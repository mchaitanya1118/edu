# ============================================
# AusEdu Connect – Docker Compose Stack
# ============================================
# Run: docker compose up --build
# Dev migrate:  docker compose run --rm api npx prisma migrate dev
# Seed:         docker compose run --rm api npx prisma db seed
# ============================================

name: aus-edu-connect

volumes:
  pgdata:
  redisdata:

services:
  # -------------------------------------------
  # PostgreSQL (production: never exposed to network)
  # -------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aus-edu-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Disabled by default. Open only if you need local psql access.
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  # -------------------------------------------
  # Redis (cache / rate limit / queues)
  # -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aus-edu-redis
    ports:
      # Disabled by default.
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  # -------------------------------------------
  # Backend API (NestJS)
  # -------------------------------------------
  api:
    build:
      context: ../../packages/api
      dockerfile: Dockerfile
    container_name: aus-edu-api
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DB_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:}
      S3_REGION: ${S3_REGION:}
      S3_BUCKET: ${S3_BUCKET:}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:}
      # Background worker shutdown
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${API_PORT:-4000}:4000'
    restart: unless-stopped
    networks:
      - backend

  # -------------------------------------------
  # Frontend (Vite)
  # -------------------------------------------
  web:
    build:
      context: ../../packages/web
      dockerfile: Dockerfile
    container_name: aus-edu-web
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-4000}/
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-5173}:5173'
    restart: unless-stopped
    networks:
      - backend

  # -------------------------------------------
  # Background worker (emails / reports / jobs)
  # -------------------------------------------
  worker:
    build:
      context: ../../packages/api
      dockerfile: Dockerfile.worker
    container_name: aus-edu-worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:}
      S3_REGION: ${S3_REGION:}
      S3_BUCKET: ${S3_BUCKET:}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

volumes:
  pgdata:
  redisdata:
  storage_data:

networks:
  backend:
    driver: bridge
